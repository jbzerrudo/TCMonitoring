var KEY = 'tcr-key-' + LOCK.salt;
var $ = function (id) { return document.getElementById(id); };
var bytes = function (b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
var b64 = function (buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };

function fail(t) { $('msg').textContent = t; $('go').disabled = false; }
function derive(pw) {
  return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {

  });

function open(key, keep) {
